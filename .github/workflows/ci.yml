name: 株式ニュースフォルダー CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 株式ニュース共通処理を検証
        run: npm run stock-news:test

      - name: 端末内データ処理を検証
        run: npm run test:stock

      - name: 型チェック
        run: npm run typecheck

      - name: 本番ビルド
        run: npm run build
