name: 独立版コードの初回取り込み

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-standalone.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取り込みブランチを取得
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: 安全版の移行パッケージを取得
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/nsaya0607ta-lab/my-app/agent/publish-stock-news-transfer-safe/transfer/stock-news-folder-ready-safe.zip' \
            --output "$RUNNER_TEMP/stock-news-folder-ready-safe.zip"
          mkdir -p "$RUNNER_TEMP/imported"
          unzip -q "$RUNNER_TEMP/stock-news-folder-ready-safe.zip" -d "$RUNNER_TEMP/imported"
          ROOT="$RUNNER_TEMP/imported/stock-news-folder"
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/app/page.tsx"
          test -f "$ROOT/.github/workflows/ci.yml"
          test -f "$ROOT/.github/workflows/stock-news-scheduler.yml"
          ROOT="$ROOT" python - <<'PY'
          import os
          from pathlib import Path
          workflow = (Path(os.environ['ROOT']) / '.github/workflows/stock-news-scheduler.yml').read_text('utf-8')
          dollar = chr(36)
          required = [
              dollar + '{{ secrets.GEMINI_API_KEY }}',
              dollar + '{{ secrets.ALPHA_VANTAGE_API_KEY }}',
              dollar + '{{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}',
          ]
          if not all(marker in workflow for marker in required):
              raise SystemExit('環境変数プレースホルダーの検査に失敗しました')
          PY

      - name: 独立版をリポジトリ直下へ配置
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'audit.json' \
            --exclude '.github/workflows/import-standalone.yml' \
            "$RUNNER_TEMP/imported/stock-news-folder/" "$GITHUB_WORKSPACE/"

      - name: コードをコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "株式ニュースフォルダーを独立リポジトリ化"
          git push origin HEAD:${{ github.head_ref }}
