name: 独立版コードの初回取り込み

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-standalone.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取り込みブランチを取得
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: 移行パッケージを取得
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/nsaya0607ta-lab/my-app/agent/publish-stock-news-transfer/transfer/stock-news-folder-ready.zip' \
            --output "$RUNNER_TEMP/stock-news-folder-ready.zip"
          mkdir -p "$RUNNER_TEMP/imported"
          unzip -q "$RUNNER_TEMP/stock-news-folder-ready.zip" -d "$RUNNER_TEMP/imported"
          test -f "$RUNNER_TEMP/imported/stock-news-folder/package.json"
          test -f "$RUNNER_TEMP/imported/stock-news-folder/src/app/page.tsx"
          test -f "$RUNNER_TEMP/imported/stock-news-folder/.github/workflows/ci.yml"

      - name: 独立版をリポジトリ直下へ配置
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'audit.json' \
            --exclude '.github/workflows/import-standalone.yml' \
            "$RUNNER_TEMP/imported/stock-news-folder/" "$GITHUB_WORKSPACE/"

      - name: コードをコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "株式ニュースフォルダーを独立リポジトリ化"
          git push origin HEAD:${{ github.head_ref }}
